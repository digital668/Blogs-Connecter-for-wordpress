name: Site manager

# Adds websites from the "Add a website" issue form, and runs commands typed
# as comments on a website's issue (/test /write /pause /mode … /help).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: site-manager-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  manage:
    # Only the repo owner / collaborators can add sites or run commands.
    if: >-
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Handle issue / command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AUTOPILOT_PAUSED: ${{ vars.AUTOPILOT_PAUSED }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -m seo_platform issue

      - name: Save changes
        if: always()
        run: |
          mkdir -p data docs/data
          git config user.name  "seo-autopilot[bot]"
          git config user.email "seo-autopilot@users.noreply.github.com"
          git add -A sites.yaml data docs/data
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "SEO Autopilot: site manager (issue #${{ github.event.issue.number }})"
          git pull --rebase --autostash || true
          git push || echo "::warning title=Save::Could not push. Settings → Actions → General → Workflow permissions → Read and write."
